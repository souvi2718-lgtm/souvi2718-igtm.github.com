<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خريطة الأرقام الذكية</title>

<style>
body {font-family: Tahoma; background:#f5f5f5; padding:15px;}
.container {max-width:800px; margin:auto; background:#fff; padding:20px; border-radius:12px;}
input,button {padding:10px; margin:5px; border-radius:8px; border:1px solid #ccc;}
button {background:#1976d2; color:#fff; cursor:pointer;}
#map {height:400px; margin-top:10px; border-radius:10px;}
.result {background:#fafafa; padding:10px; margin:5px 0; border-radius:8px;}
.distance {color:red; font-weight:bold;}
.status {margin:5px; font-size:14px;}
</style>
</head>

<body>

<div class="container">
<h2>📍 خريطة الأرقام الذكية</h2>

<!-- إضافة -->
<input type="text" id="phone" placeholder="رقم الهاتف">
<input type="text" id="desc" placeholder="الوصف">
<button onclick="addPhone()">➕ إضافة مع موقعي</button>

<hr>

<!-- الموقع -->
<button onclick="getLocation()">📍 تحديد موقعي</button>
<div class="status" id="status"></div>

<!-- البحث -->
<input type="text" id="search" placeholder="ابحث عن رقم أو وصف">
<button onclick="search()">🔍 بحث</button>

<div id="map"></div>
<div id="results"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<!-- Google Maps -->
<script src="https://maps.googleapis.com/maps/api/js?key=PUT_mujz5ur4IwsFMbk2grA6T_81TFw&callback=initMap" async defer></script>

<script>
// 🔥 Firebase config
const firebaseConfig = {
    apiKey: "AIzaSyA49f-ukAc09qCW97P5WNlTw-smlJhXCT4",
    authDomain: "atomic-parity-485123-p9.firebaseapp.com",
    databaseURL: "https://atomic-parity-485123-p9-default-rtdb.firebaseio.com",
    projectId: "atomic-parity-485123-p9",
    storageBucket: "atomic-parity-485123-p9.firebasestorage.app",
    messagingSenderId: "639339092171",
    appId: "1:639339092171:android:0b666b91c6927a21a9234e"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let map, myLat, myLng;
let markers = [];

// 🗺️ الخريطة
function initMap() {
    map = new google.maps.Map(document.getElementById("map"), {
        center: {lat: 18.08, lng: -15.97},
        zoom: 12
    });
}

// 📍 تحديد الموقع
function getLocation() {
    const status = document.getElementById("status");

    navigator.geolocation.getCurrentPosition(pos => {
        myLat = pos.coords.latitude;
        myLng = pos.coords.longitude;

        new google.maps.Marker({
            position: {lat: myLat, lng: myLng},
            map: map,
            title: "موقعي"
        });

        map.setCenter({lat: myLat, lng: myLng});
        status.innerHTML = "✅ تم تحديد موقعك";
    }, () => {
        status.innerHTML = "❌ فشل تحديد الموقع";
    });
}

// ➕ إضافة رقم
function addPhone() {
    const phone = document.getElementById('phone').value.trim();
    const desc = document.getElementById('desc').value.trim();

    if (!phone) return alert("أدخل الرقم");
    if (!myLat) return alert("حدد موقعك أولاً");

    db.ref('phones').push({
        phone: phone,
        description: desc,
        lat: myLat,
        lng: myLng,
        createdAt: Date.now()
    });

    alert("✅ تم الحفظ");
}

// 📏 حساب المسافة
function distance(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2-lat1)*Math.PI/180;
    const dLon = (lon2-lon1)*Math.PI/180;

    const a = Math.sin(dLat/2)**2 +
              Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
              Math.sin(dLon/2)**2;

    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// 🔍 البحث الذكي
function search() {
    const val = document.getElementById('search').value.toLowerCase();
    const results = document.getElementById('results');

    results.innerHTML = "";
    markers.forEach(m => m.setMap(null));
    markers = [];

    db.ref('phones').once('value', snap => {
        snap.forEach(child => {
            const d = child.val();

            const phone = (d.phone || "").toLowerCase();
            const desc = (d.description || "").toLowerCase();

            if (phone.includes(val) || desc.includes(val)) {

                const dist = distance(myLat, myLng, d.lat, d.lng);

                if (dist <= 10) {

                    const marker = new google.maps.Marker({
                        position: {lat: d.lat, lng: d.lng},
                        map: map
                    });

                    const info = new google.maps.InfoWindow({
                        content: `<b>${d.phone}</b><br>${d.description}<br>${dist.toFixed(2)} كم`
                    });

                    marker.addListener('click', () => info.open(map, marker));
                    markers.push(marker);

                    results.innerHTML += `
                        <div class="result">
                            📞 ${d.phone}<br>
                            📝 ${d.description}<br>
                            <span class="distance">📏 ${dist.toFixed(2)} كم</span>
                        </div>
                    `;
                }
            }
        });
    });
}
</script>

</body>
</html>
